<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>SimpleOS</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>

    <body>

        <div id="welcome" class="window">

            <div id="welcomeheader" class="windowheader">
                <div id="headertext" class="windowheadertext">Welcome</div>

                <div id="welcomeclose" class="windowclose">X</div>
            </div>

            <h1 id="welcometext" class="windowtext">This is a simple OS.</h1>
        </div>

        <div id="taskbar">
            <div id="windows">
                <p id="welcomeopen" class="windowopen">SimpleOS</p>
            </div>

            <div class="container">
                <span id="time">10:10 PM</span>
                <span id="date">11/11/2026</span>
            </div>
        </div>

    </body>

</html>
